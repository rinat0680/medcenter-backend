name: Build and deploy ASP.NET Core app to Azure Web App - medical-center-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MedicalCenter.sln

      - name: Build solution
        run: dotnet build MedicalCenter.sln --configuration Release --no-restore

      - name: Publish app
        run: dotnet publish MedicalCenterApi.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish


  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CFBD8C6B298F4D28AE28269826C17DEA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5F13DC0F4C6741A2BDF6D588FD4BD811 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9A47D5A3453C429481523E60F7CA95CC }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: medical-center-api
          slot-name: Production
          package: ./publish
