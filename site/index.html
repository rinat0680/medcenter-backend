<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medcenter API</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #f3f6fa;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 760px;
            margin: auto;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 {
            margin-top: 0;
            color: #1769aa;
        }

        .status {
            color: #16803c;
            font-weight: bold;
        }

        .item {
            margin: 18px 0;
            padding: 14px;
            background: #f8fafc;
            border-left: 4px solid #1769aa;
        }

        a {
            color: #1769aa;
        }

        code {
            padding: 3px 6px;
            background: #e5e7eb;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Medcenter API</h1>

        <p class="status">● API запущен и доступен</p>

        <div class="item">
            <strong>Маршрут запроса</strong><br>
            Интернет: <code>порт 80</code> → Nginx →
            <code>127.0.0.1:5000</code> → ASP.NET Core Web API
        </div>

        <div class="item">
            <strong>Исходный код</strong><br>
            <a href="https://github.com/rinat0680/medcenter-backend" target="_blank">
                GitHub: medcenter-backend
            </a>
        </div>

        <div class="item">
            <strong>Ветка сборки</strong><br>
            <code>main</code>
        </div>

        <div class="item">
            <strong>Последнее обновление</strong><br>
            23.08.2026
        </div>
    </main>
</body>
</html>
